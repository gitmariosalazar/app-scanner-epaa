name: flutter_application
description: 'Una aplicación de escaneo en Flutter'
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^9.2.1
  go_router: ^17.2.3
  mobile_scanner: ^7.0.1
  shared_preferences: ^2.5.3
  package_info_plus: ^10.1.0
  http: ^1.5.0
  image_picker: ^1.2.0
  flutter_dotenv: ^6.0.0
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  mime: ^2.0.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_osm_plugin: ^1.4.6
  json_annotation: ^4.9.0
  meta: ^1.17.0
  bloc_concurrency: ^0.3.0
  google_maps_flutter: ^2.3.0
  intl: ^0.20.2
  socket_io_client: ^3.1.4
  url_launcher: ^6.3.2
  cached_network_image: '^3.4.1'
  flutter_riverpod: ^3.0.0
  share_plus: ^13.2.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_launcher_icons: ^0.14.4
  http_parser: ^4.1.2
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  connectivity_plus: ^6.1.5
  internet_connection_checker: ^3.0.1

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  min_sdk_android: 21
  image_path: 'assets/images/app_logo.png'
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: 'assets/images/app_logo.png'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  json_serializable: ^6.11.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/Roboto-Regular.ttf
    - .env.dev
    - .env.production
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
